<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OURCAR LINE友だちカウンター</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #ffffff;
    color: #222;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ─── 左上ラベル ─── */
  .top-label {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #38b6ff;
    color: #fff;
    font-size: 1.3rem;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 10px;
    letter-spacing: 0.05em;
  }

  /* ─── メインタイトル ─── */
  .logo {
    font-size: 3.15rem;
    font-weight: 900;
    color: #06C755;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  /* ─── ニアピン賞テキスト（ロゴ直下・虹色・大きく） ─── */
  .pitari-section {
    text-align: center;
    margin-bottom: 20px;
  }

  .pitari-text {
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(90deg, #ff0000, #ff8800, #ffdd00, #00cc44, #38b6ff, #6644ff, #cc00cc, #ff0000);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbowShift 3s linear infinite;
    line-height: 1.3;
  }

  @keyframes rainbowShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  /* ─── スロットカウンター ─── */
  .slot-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .slot-digit {
    width: 160px;
    height: 220px;
    background: #fafafa;
    border: 3px solid #ddd;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }

  .slot-digit .digit-strip {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .slot-digit .digit-cell {
    width: 100%;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9rem;
    font-weight: 900;
    color: #222;
  }

  .slot-comma {
    font-size: 7rem;
    font-weight: 900;
    color: #ccc;
    margin: 0 -4px;
    align-self: flex-end;
    padding-bottom: 16px;
  }

  .counter-unit {
    font-size: 4rem;
    font-weight: 700;
    color: #555;
    margin-left: 16px;
    align-self: flex-end;
    padding-bottom: 28px;
  }

  /* ─── あと○人（虹色・大きく） ─── */
  .remaining-text {
    font-size: 3rem;
    font-weight: 900;
    background: linear-gradient(90deg, #ff0000, #ff8800, #ffdd00, #00cc44, #38b6ff, #6644ff, #cc00cc, #ff0000);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbowShift 3s linear infinite;
    margin-top: 4px;
  }

  /* ─── +1 演出 ─── */
  .plus-one {
    position: fixed;
    font-size: 4.5rem;
    font-weight: 900;
    color: #38b6ff;
    pointer-events: none;
    opacity: 0;
    z-index: 50;
  }

  .plus-one.animate {
    animation: plusOneUp 1.2s ease-out forwards;
  }

  @keyframes plusOneUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    50% { opacity: 1; transform: translateY(-80px) scale(1.4); }
    100% { opacity: 0; transform: translateY(-160px) scale(0.8); }
  }

  /* ─── フッター ─── */
  .footer {
    position: fixed;
    bottom: 12px;
    right: 16px;
    color: #ccc;
    font-size: 0.85rem;
  }

  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4ade80;
    margin-right: 4px;
    vertical-align: middle;
  }
  .status-dot.error { background: #f87171; }
  .status-dot.loading { background: #facc15; }

  /* ─── 設定パネル ─── */
  .settings-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    background: #eee;
    border: none;
    color: #aaa;
    font-size: 1.1rem;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .settings-toggle:hover { color: #555; background: #ddd; }

  .settings-panel {
    display: none;
    position: fixed;
    top: 48px;
    right: 12px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    z-index: 200;
    min-width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .settings-panel.open { display: block; }

  .settings-panel label {
    display: block;
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 4px;
    margin-top: 12px;
  }
  .settings-panel label:first-child { margin-top: 0; }

  .settings-panel input {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #fafafa;
    color: #222;
    font-size: 0.95rem;
  }

  .settings-panel button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #38b6ff;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
  }
  .settings-panel button:hover { background: #2a9ad8; }

  .settings-panel .note {
    font-size: 0.7rem;
    color: #bbb;
    margin-top: 8px;
  }

  /* ─── 目標達成演出 ─── */
  .flash-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    z-index: 101;
    pointer-events: none;
  }

  @keyframes pachinkoFlash {
    0% { opacity: 0; background: #ff0000; }
    8% { opacity: 0.7; background: #ff0000; }
    16% { opacity: 0; }
    24% { opacity: 0.7; background: #ffd700; }
    32% { opacity: 0; }
    40% { opacity: 0.8; background: #fff; }
    48% { opacity: 0; }
    56% { opacity: 0.6; background: #ff0000; }
    64% { opacity: 0; }
    72% { opacity: 0.7; background: #ffd700; }
    80% { opacity: 0; }
    88% { opacity: 0.9; background: #fff; }
    94% { opacity: 0.3; background: #ffd700; }
    100% { opacity: 0; }
  }
  .flash-layer.active { animation: pachinkoFlash 2.5s ease-out forwards; }

  .rainbow-border {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 10px solid transparent;
    z-index: 102;
    pointer-events: none;
    opacity: 0;
  }

  @keyframes rainbowBorder {
    0% { opacity: 0; border-color: #ff0000; }
    10% { opacity: 1; border-color: #ff0000; }
    25% { border-color: #ffdd00; }
    40% { border-color: #00cc44; }
    55% { border-color: #38b6ff; }
    70% { border-color: #6644ff; }
    85% { border-color: #cc00cc; }
    95% { opacity: 1; border-color: #ff0000; }
    100% { opacity: 0; }
  }
  .rainbow-border.active { animation: rainbowBorder 3s ease-out forwards; }

  .milestone-text {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 5.5rem;
    font-weight: 900;
    z-index: 103;
    pointer-events: none;
    white-space: nowrap;
    text-shadow: 0 0 40px rgba(255,215,0,0.8), 0 0 80px rgba(255,215,0,0.4);
    background: linear-gradient(90deg, #ff0000, #ff8800, #ffdd00, #00cc44, #38b6ff, #6644ff, #cc00cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
  }

  @keyframes milestoneAppear {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(-10deg); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.3) rotate(3deg); }
    50% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5) rotate(0deg); }
  }
  .milestone-text.active { animation: milestoneAppear 3s ease-out forwards; }

  .confetti {
    position: fixed;
    z-index: 104;
    pointer-events: none;
  }

  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div class="top-label">OURCAR</div>

<button class="settings-toggle" onclick="toggleSettings()">Settings</button>

<div class="settings-panel" id="settingsPanel">
  <label>GAS Web App URL</label>
  <input type="text" id="inputUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <label>手動カウント（API未接続時）</label>
  <input type="number" id="inputManual" placeholder="例: 1234">
  <label>ニアピン賞間隔（○人ごと）</label>
  <input type="number" id="inputMilestone" placeholder="100" value="100">
  <label>ニアピン賞 現在の値（±）</label>
  <input type="text" id="inputPitariFrom" placeholder="0.01" value="0.01">
  <label>ニアピン賞 次の値（±）</label>
  <input type="text" id="inputPitariTo" placeholder="0.03" value="0.03">
  <button onclick="saveSettings()">保存して閉じる</button>
  <p class="note">設定はブラウザに保存されます（Sキーで開閉）</p>
</div>

<div class="logo">LINE 友だち登録数</div>

<div class="pitari-section">
  <div class="pitari-text" id="pitariText"></div>
</div>

<div class="slot-container" id="slotContainer"></div>

<div class="remaining-text" id="remainingText"></div>

<div class="footer">
  <span class="status-dot" id="statusDot"></span>
</div>

<div class="flash-layer" id="flashLayer"></div>
<div class="rainbow-border" id="rainbowBorder"></div>
<div class="milestone-text" id="milestoneText"></div>

<script>
  const POLL_INTERVAL = 10000;
  const DIGIT_COUNT = 4;
  const CELL_HEIGHT = 220;

  const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwJtXOe-OcpJc_k3Nxd6coRTEVNB25Jw82mQXMBu6ePYp0tvXDery8O-rwNv9GiKLxw/exec';
  let gasUrl = localStorage.getItem('gasUrl') || DEFAULT_GAS_URL;
  let currentCount = 0;
  let milestoneInterval = parseInt(localStorage.getItem('milestoneInterval') || '100', 10);
  let pitariFrom = localStorage.getItem('pitariFrom') || '0.01';
  let pitariTo = localStorage.getItem('pitariTo') || '0.03';
  let prevCount = 0;

  function buildSlots() {
    const container = document.getElementById('slotContainer');
    container.innerHTML = '';
    for (let i = 0; i < DIGIT_COUNT; i++) {
      if (i === 1) {
        const comma = document.createElement('span');
        comma.className = 'slot-comma';
        comma.textContent = ',';
        container.appendChild(comma);
      }
      const slot = document.createElement('div');
      slot.className = 'slot-digit';
      slot.id = 'slot-' + i;
      const strip = document.createElement('div');
      strip.className = 'digit-strip';
      strip.id = 'strip-' + i;
      for (let d = 0; d <= 10; d++) {
        const cell = document.createElement('div');
        cell.className = 'digit-cell';
        cell.textContent = d % 10;
        strip.appendChild(cell);
      }
      slot.appendChild(strip);
      container.appendChild(slot);
    }
    const unit = document.createElement('span');
    unit.className = 'counter-unit';
    unit.textContent = '人';
    container.appendChild(unit);
  }

  function setSlotValue(num, animate) {
    const digits = String(num).padStart(DIGIT_COUNT, '0').split('').map(Number);
    for (let i = 0; i < DIGIT_COUNT; i++) {
      const strip = document.getElementById('strip-' + i);
      const targetDigit = digits[i];
      if (animate) {
        strip.style.transition = 'none';
        strip.style.transform = 'translateY(0)';
        setTimeout(() => {
          strip.style.transition = `transform ${0.6 + i * 0.1}s cubic-bezier(0.23, 1, 0.32, 1)`;
          strip.style.transform = `translateY(-${targetDigit * CELL_HEIGHT}px)`;
        }, i * 80);
      } else {
        strip.style.transition = 'none';
        strip.style.transform = `translateY(-${targetDigit * CELL_HEIGHT}px)`;
      }
    }
  }

  function showPlusOne() {
    const el = document.createElement('div');
    el.className = 'plus-one';
    el.textContent = '+1';
    const container = document.getElementById('slotContainer');
    const rect = container.getBoundingClientRect();
    el.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 150) + 'px';
    el.style.top = (rect.top - 30) + 'px';
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('animate'));
    setTimeout(() => el.remove(), 1300);
  }

  function updatePitariText() {
    const nextMilestone = Math.ceil((currentCount + 1) / milestoneInterval) * milestoneInterval;
    const remaining = nextMilestone - currentCount;
    document.getElementById('pitariText').textContent =
      `${nextMilestone.toLocaleString()}人達成でニアピン賞 ±${pitariFrom} → ±${pitariTo} にアップ！`;
    document.getElementById('remainingText').textContent =
      `あと ${remaining.toLocaleString()}人！`;
  }

  function triggerMilestone(count) {
    const flash = document.getElementById('flashLayer');
    flash.classList.remove('active'); void flash.offsetWidth;
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 2600);

    const border = document.getElementById('rainbowBorder');
    border.classList.remove('active'); void border.offsetWidth;
    border.classList.add('active');
    setTimeout(() => border.classList.remove('active'), 3100);

    const text = document.getElementById('milestoneText');
    text.textContent = `${count.toLocaleString()}人 達成！！`;
    text.classList.remove('active'); void text.offsetWidth;
    text.classList.add('active');
    setTimeout(() => text.classList.remove('active'), 3100);

    spawnConfetti(80);
  }

  function spawnConfetti(count) {
    const colors = ['#ff0000', '#ff8800', '#ffdd00', '#00cc44', '#38b6ff', '#6644ff', '#cc00cc', '#ffd700'];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      const size = 8 + Math.random() * 12;
      const isCircle = Math.random() > 0.5;
      el.style.width = size + 'px';
      el.style.height = isCircle ? size + 'px' : size * 0.6 + 'px';
      el.style.borderRadius = isCircle ? '50%' : '2px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '-20px';
      el.style.animation = `confettiFall ${2 + Math.random() * 2}s ease-in ${Math.random() * 0.8}s forwards`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }
  }

  function checkMilestone(oldCount, newCount) {
    if (oldCount === 0) return;
    const oldM = Math.floor(oldCount / milestoneInterval);
    const newM = Math.floor(newCount / milestoneInterval);
    if (newM > oldM) {
      setTimeout(() => triggerMilestone(newM * milestoneInterval), 800);
    }
  }

  async function fetchData() {
    if (!gasUrl) return;
    try {
      const res = await fetch(gasUrl);
      const data = await res.json();
      const newCount = data.lineFriends || 0;
      if (newCount !== currentCount) {
        const diff = newCount - currentCount;
        prevCount = currentCount;
        if (diff > 0) {
          const showCount = Math.min(diff, 5);
          for (let i = 0; i < showCount; i++) {
            setTimeout(() => showPlusOne(), i * 200);
          }
        }
        checkMilestone(currentCount, newCount);
        currentCount = newCount;
        setSlotValue(currentCount, true);
        updatePitariText();
      }
      setStatus('ok', '最終更新: ' + new Date().toLocaleTimeString('ja-JP'));
    } catch (err) {
      setStatus('error', '再接続中...');
    }
  }

  function setStatus(type, text) {
    document.getElementById('statusDot').className = 'status-dot' + (type === 'ok' ? '' : type === 'error' ? ' error' : ' loading');
    document.getElementById('statusText').textContent = text;
  }

  function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }

  function saveSettings() {
    const url = document.getElementById('inputUrl').value.trim();
    const manual = document.getElementById('inputManual').value.trim();
    const milestone = document.getElementById('inputMilestone').value.trim();
    const from = document.getElementById('inputPitariFrom').value.trim();
    const to = document.getElementById('inputPitariTo').value.trim();
    if (url) { localStorage.setItem('gasUrl', url); gasUrl = url; }
    if (milestone) { milestoneInterval = parseInt(milestone, 10) || 100; localStorage.setItem('milestoneInterval', String(milestoneInterval)); }
    if (from) { pitariFrom = from; localStorage.setItem('pitariFrom', from); }
    if (to) { pitariTo = to; localStorage.setItem('pitariTo', to); }
    if (manual) {
      currentCount = parseInt(manual, 10);
      setSlotValue(currentCount, true);
      updatePitariText();
      if (!url) setStatus('ok', '手動モード');
    }
    updatePitariText();
    toggleSettings();
    if (url && !window._polling) { fetchData(); setInterval(fetchData, POLL_INTERVAL); window._polling = true; }
  }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 's') toggleSettings();
    if (e.key === '+' || e.key === ';') {
      prevCount = currentCount; currentCount += 1;
      showPlusOne(); checkMilestone(prevCount, currentCount);
      setSlotValue(currentCount, true); updatePitariText();
    }
    if (e.key === 'm') triggerMilestone(currentCount);
  });

  window.addEventListener('load', () => {
    buildSlots();
    const savedUrl = localStorage.getItem('gasUrl');
    const savedMilestone = localStorage.getItem('milestoneInterval');
    const savedFrom = localStorage.getItem('pitariFrom');
    const savedTo = localStorage.getItem('pitariTo');
    if (savedMilestone) { milestoneInterval = parseInt(savedMilestone, 10); document.getElementById('inputMilestone').value = milestoneInterval; }
    if (savedFrom) { pitariFrom = savedFrom; document.getElementById('inputPitariFrom').value = pitariFrom; }
    if (savedTo) { pitariTo = savedTo; document.getElementById('inputPitariTo').value = pitariTo; }
    document.getElementById('inputUrl').value = gasUrl;
    fetchData(); setInterval(fetchData, POLL_INTERVAL); window._polling = true;
  });
</script>

</body>
</html>
